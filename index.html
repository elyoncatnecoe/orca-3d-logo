        (function () {
            'use strict';
// ---- 原始 SVG 轮廓（来自 deepseek logo，原样保留）
const SVG = {

  "TAIL_PATH": "M 17.902 4.103 L 22.379 9.998 C 22.435 9.614, 22.507 9.073, 22.499 8.762 C 22.494 8.572, 22.538 8.499, 22.755 8.477 C 23.354 8.408, 23.935 8.244, 24.469 7.950 C 26.019 7.104, 26.644 5.713, 26.791 4.047 C 26.813 3.792, 26.787 3.529, 26.517 3.395 C 26.235 3.257, 26.114 3.520, 25.949 3.653 C 25.892 3.697, 25.845 3.753, 25.797 3.805 C 25.385 4.245, 24.903 4.534, 24.274 4.500 C 23.354 4.448, 22.568 4.737, 21.873 5.441 C 21.726 4.573, 21.235 4.055, 20.489 3.723 C 20.099 3.551, 19.703 3.377, 19.430 3.002 C 19.239 2.735, 19.186 2.437, 19.091 2.143 C 19.030 1.966, 18.970 1.785, 18.766 1.754 C 18.544 1.720, 18.457 1.905, 18.370 2.061 C 18.023 2.695, 17.889 3.395, 17.902 4.103 Z"

// =====================================================================
//  虎鲸 · 可打印几何重建（纯 JS，不依赖 three）
//  - 身体：绕曲线中轴的结构化旋成体（两端单顶点，无退化三角）
//  - 背鳍/胸鳍/尾鳍：按原 SVG 轮廓做「两条边缘线放样」的结构化网格，
//    厚度按到边缘距离 + 沿翼展渐薄 做透镜形截面，并带弯曲(camber)
//  - 每个零件本身都是封闭流形；最终可用 manifold 合并成一个实体
// =====================================================================
const CONFIG = {
    SWEPT_SLICES: 60, SWEPT_RINGS: 48,
    TAIL_FORK_SCALE: 0.177, TAIL_THICKNESS: 0.06, TAIL_OPEN_ANGLE_DEG: 76.95,
    TAIL_NOTCH_DX: 0.3, TAIL_NOTCH_DY: 0.5, TAIL_TILT_DEG: 50,
    DORSAL_START_FRAC: 0.331, DORSAL_END_FRAC: 0.559, DORSAL_SAMPLES: 40,
    DORSAL_THICKNESS: 0.06, DORSAL_HEIGHT_SCALE: 0.3186, DORSAL_SINK: 0.0,
    PEC_START_FRAC: 0.38, PEC_END_FRAC: 0.48, PEC_SPAN: 0.924, PEC_SWEEP: 0.33,
    PEC_THICKNESS: 0.05, PEC_ANGLE_DEG: 30, PEC_RADIAN: 130, PEC_SINK: 0.0,
    PEC_OUTWARD_OFFSET: -0.025, PEC_BACKWARD_OFFSET: 0.0,
    BODY_TARGET_HEIGHT: 3.5,
    AUTO_ROTATE_SPEED: 1.6, FLOAT_SPEED: 1.2, FLOAT_AMPLITUDE: 0.06,
    BROW_SCALE: 0.65, BROW_OFFSET_X: -35.4, BROW_OFFSET_Y: 6.0, BROW_LIFT: 0.9,
    EYE_OFFSET_Y: 10.5, EYE_RADIUS: 2.8, EYE_CIRCLE_SEGMENTS: 32,
    COLOR_BODY_BLUE: 0x4D6BFE, COLOR_WHITE: 0xffffff,
};
const TAIL_NOTCH = { x: 21.873, y: 5.441 };
const DORSAL_BL = 10.436, DORSAL_BR = 13.852;
const PEC_BL = 16.747, PEC_BR = 20.614, PEC_DROP = 0.288;

// 打印/造型可调参数（单位：模型单位，身体高 = 3.5）
const PRINT_DEFAULTS = {
    relief: 0.04,        // 眼斑/眼睛浮雕高度（模型单位，0 = 不生成）
    minWall: 0.055,      // 最薄边缘厚度（模型单位）
    finScale: 1.0,       // 鳍整体厚度倍率
    curl: 1.0,           // 鳍/尾弧度倍率
    bodyNS: 160, bodyNR: 96,
    plateQ: 1.0,         // 鳍网格密度倍率
};

// ------------------------------ 向量/多段线工具 ------------------------------
const v3add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const v3sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const v3mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const v3dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const v3cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const v3len = (a) => Math.hypot(a[0], a[1], a[2]);
const v3norm = (a) => { const l = v3len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const sstep = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };

function polyArea2(p) { let a = 0; for (let i = p.length - 1, j = 0; j < p.length; i = j++) a += p[i].x * p[j].y - p[j].x * p[i].y; return a * 0.5; }
function dedupe2(P, eps = 1e-9) {
    const o = [P[0]];
    for (let i = 1; i < P.length; i++) { const q = o[o.length - 1]; if (Math.hypot(P[i][0] - q[0], P[i][1] - q[1]) > eps) o.push(P[i]); }
    return o;
}
function cumLen2(P) { const c = [0]; for (let i = 1; i < P.length; i++) c.push(c[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1])); return c; }
function atFrac2(P, c, t) {
    const L = c[c.length - 1], s = clamp01(t) * L;
    let lo = 0, hi = P.length - 1;
    while (hi - lo > 1) { const md = (lo + hi) >> 1; if (c[md] <= s) lo = md; else hi = md; }
    const seg = (c[hi] - c[lo]) || 1, u = (s - c[lo]) / seg;
    return [P[lo][0] + (P[hi][0] - P[lo][0]) * u, P[lo][1] + (P[hi][1] - P[lo][1]) * u];
}
function resample2(P, n) { const c = cumLen2(P), o = []; for (let i = 0; i <= n; i++) o.push(atFrac2(P, c, i / n)); return o; }
function makeSegs(polys) {
    const segs = [];
    for (const P of polys) for (let i = 0; i + 1 < P.length; i++) segs.push([P[i][0], P[i][1], P[i + 1][0], P[i + 1][1]]);
    return segs;
}
function distSegs(x, y, segs) {
    let best = 1e30;
    for (let i = 0; i < segs.length; i++) {
        const s = segs[i], dx = s[2] - s[0], dy = s[3] - s[1];
        const l2 = dx * dx + dy * dy;
        let t = l2 > 0 ? ((x - s[0]) * dx + (y - s[1]) * dy) / l2 : 0;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const px = s[0] + t * dx - x, py = s[1] + t * dy - y;
        const d = px * px + py * py;
        if (d < best) best = d;
    }
    return Math.sqrt(best);
}

// ------------------------------ 原始轮廓 → 中轴/半径剖面 ------------------------------
let _prof = null;
function getProfile() {
    if (_prof) return _prof;
    const rawContour = samplePathDense(SVG.PATH, 50, 800);
    let cx = 0, cy = 0;
    rawContour.forEach(p => { cx += p.x; cy += p.y; });
    cx /= rawContour.length; cy /= rawContour.length;
    const pts = rawContour.map(p => ({ x: (p.x - cx) * 1.1, y: -(p.y - cy) }));
    if (polyArea2(pts) < 0) pts.reverse();
    const sw0 = computeSweptProfile(pts);
    let top = -Infinity, bot = Infinity;
    for (let i = 0; i < sw0.xs.length; i++) {
        top = Math.max(top, sw0.mid[i] + sw0.rad[i]);
        bot = Math.min(bot, sw0.mid[i] - sw0.rad[i]);
    }
    const scale = CONFIG.BODY_TARGET_HEIGHT / (top - bot);
    const sw = { xs: sw0.xs.map(v => v * scale), mid: sw0.mid.map(v => v * scale), rad: sw0.rad.map(v => v * scale) };
    _prof = { cx, cy, pts, sw0, sw, scale };
    return _prof;
}

// 三次 Hermite（等距/非等距均可）
function makeHermite(X, Y) {
    const n = X.length, m = new Array(n);
    for (let i = 0; i < n; i++) {
        if (i === 0) m[i] = (Y[1] - Y[0]) / (X[1] - X[0]);
        else if (i === n - 1) m[i] = (Y[n - 1] - Y[n - 2]) / (X[n - 1] - X[n - 2]);
        else m[i] = (Y[i + 1] - Y[i - 1]) / (X[i + 1] - X[i - 1]);
    }
    return function (x) {
        if (x <= X[0]) return Y[0];
        if (x >= X[n - 1]) return Y[n - 1];
        let lo = 0, hi = n - 1;
        while (hi - lo > 1) { const md = (lo + hi) >> 1; if (X[md] <= x) lo = md; else hi = md; }
        const h = X[hi] - X[lo], t = (x - X[lo]) / h, t2 = t * t, t3 = t2 * t;
        return (2 * t3 - 3 * t2 + 1) * Y[lo] + (t3 - 2 * t2 + t) * h * m[lo] + (-2 * t3 + 3 * t2) * Y[hi] + (t3 - t2) * h * m[hi];
    };
}

let _bodyFns = null;
function getBodyFns() {
    if (_bodyFns) return _bodyFns;
    const { xs, mid, rad } = getProfile().sw;
    _bodyFns = { fMid: makeHermite(xs, mid), fR2: makeHermite(xs, rad.map(r => r * r)), x0: xs[0], x1: xs[xs.length - 1] };
    return _bodyFns;
}
// ------------------------------ 身体（旋成体，两端单顶点） ------------------------------
function buildBody(prof, NS, NR) {
    const { xs, mid, rad } = prof.sw;
    const fMid = makeHermite(xs, mid), fR2 = makeHermite(xs, rad.map(r => r * r));
    const x0 = xs[0], L = xs[xs.length - 1] - x0;
    const verts = [];
    const stationX = [];
    for (let i = 0; i <= NS; i++) {
        const t = i / NS;
        stationX.push(x0 + L * (0.55 * t + 0.45 * 0.5 * (1 - Math.cos(Math.PI * t))));
    }
    stationX[NS] = xs[xs.length - 1];
    const cs = [], sn = [];
    for (let k = 0; k < NR; k++) { const th = (k / NR) * Math.PI * 2; cs.push(Math.cos(th)); sn.push(Math.sin(th)); }
    verts.push([stationX[0], mid[0], 0]);                       // 起点极点
    const ring = (i) => 1 + (i - 1) * NR;                          // 第 i 圈(1..NS-1)的首顶点下标
    for (let i = 1; i < NS; i++) {
        const x = stationX[i], m = fMid(x), r = Math.sqrt(Math.max(0, fR2(x)));
        for (let k = 0; k < NR; k++) verts.push([x, m + r * cs[k], r * sn[k]]);
    }
    const endIdx = verts.length;
    verts.push([stationX[NS], mid[mid.length - 1], 0]);          // 终点极点
    const tris = [];
    for (let k = 0; k < NR; k++) { const k2 = (k + 1) % NR; tris.push([0, ring(1) + k2, ring(1) + k]); }
    for (let i = 1; i < NS - 1; i++) {
        for (let k = 0; k < NR; k++) {
            const k2 = (k + 1) % NR;
            const a = ring(i) + k, b = ring(i + 1) + k, c = ring(i) + k2, d = ring(i + 1) + k2;
            tris.push([a, c, b], [c, d, b]);
        }
    }
    for (let k = 0; k < NR; k++) { const k2 = (k + 1) % NR; tris.push([endIdx, ring(NS - 1) + k, ring(NS - 1) + k2]); }
    return { verts, tris };
}

// ------------------------------ 厚板放样（背鳍/胸鳍/尾鳍通用） ------------------------------
// spec: {lobes:[{A,B}], tList, C, frame:{o,ex,ey}, camber(a,b), thick(a,b), }
//   A、B 为从根部到梢尖的两条边缘线（2D，尖端同点）；第 i 站在 A(t_i)、B(t_i) 之间取 C+1 个弦向点
function buildPlateSolid(spec) {
    const { lobes, tList, C, frame, camber, thick } = spec;
    const ez = v3norm(v3cross(frame.ex, frame.ey));
    const verts = [], wmap = new Map(), botOf = new Map(), topTris = [];
    const key = (p) => Math.round(p[0] * 1e7) + ',' + Math.round(p[1] * 1e7) + ',' + Math.round(p[2] * 1e7);
    const vid = (p) => { const k = key(p); let id = wmap.get(k); if (id === undefined) { id = verts.length; verts.push(p); wmap.set(k, id); } return id; };
    const H = 1e-4;
    function pair(a, b) {
        const c = camber(a, b);
        const ca = (camber(a + H, b) - camber(a - H, b)) / (2 * H), cb = (camber(a, b + H) - camber(a, b - H)) / (2 * H);
        const nl = v3norm([-ca, -cb, 1]);
        const m = v3add(v3add(v3add(frame.o, v3mul(frame.ex, a)), v3mul(frame.ey, b)), v3mul(ez, c));
        const n = v3add(v3add(v3mul(frame.ex, nl[0]), v3mul(frame.ey, nl[1])), v3mul(ez, nl[2]));
        const T = thick(a, b);
        const t = vid(v3add(m, v3mul(n, T / 2))), bt = vid(v3sub(m, v3mul(n, T / 2)));
        if (!botOf.has(t)) botOf.set(t, bt);
        return [t, bt];
    }
    let negCells = 0, totalCells = 0;
    const botTris = [];
    for (const lobe of lobes) {
        const A = lobe.A, B = lobe.B, cA = cumLen2(A), cB = cumLen2(B);
        const R = tList.length, rows = [];
        for (let i = 0; i < R; i++) {
            const pa = atFrac2(A, cA, tList[i]), pb = atFrac2(B, cB, tList[i]);
            const row = [];
            for (let j = 0; j <= C; j++) {
                const cj = 0.5 - 0.5 * Math.cos(Math.PI * j / C);
                row.push({ P: [pa[0] + (pb[0] - pa[0]) * cj, pa[1] + (pb[1] - pa[1]) * cj] });
            }
            rows.push(row);
        }
        // 雅可比符号（决定三角形朝向）
        let area = 0;
        for (let i = 0; i + 1 < R; i++) for (let j = 0; j < C; j++) {

        `尺寸 <b>${dx.toFixed(1)} × ${dz.toFixed(1)} × ${dy.toFixed(1)} mm</b>（长×宽×高）<br>` +
        `零件：身体 / 背鳍 / 胸鳍×2 / 尾鳍 / 眼斑·眼睛浮雕 · 共 ${tris.toLocaleString()} 三角面<br>` +
        `各零件封闭检查：${open === 0 && bad === 0 ? '<b class="ok">全部水密 ✓</b>' : '<b class="bad">发现问题 ✗</b>'}　` +
        `<span class="dim">（体积≈${(vol * k * k * k / 1000).toFixed(1)} cm³，未计重叠）</span><br>` +
        `边缘最薄 <b>${p.wallMM.toFixed(2)} mm</b> · 重建用时 ${ms.toFixed(0)} ms`;
}
function bounds(parts) {
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (const m of Object.values(parts)) for (const v of m.verts) for (let a = 0; a < 3; a++) { if (v[a] < mn[a]) mn[a] = v[a]; if (v[a] > mx[a]) mx[a] = v[a]; }
    return { min: mn, max: mx };
}

// ---------- 布尔合并（manifold-3d，WASM） ----------
let _manifoldPromise = null;
function getManifold() {
    if (!_manifoldPromise) {
        _manifoldPromise = (async () => {
            if (typeof window.ORCA_MANIFOLD_LOADER === 'function') return await window.ORCA_MANIFOLD_LOADER();
            const mod = await import(MANIFOLD_URL);
            const wasm = await mod.default(); wasm.setup(); return wasm;
        })();
        _manifoldPromise.catch(() => { _manifoldPromise = null; });
    }
    return _manifoldPromise;
}
function partToManifold(wasm, m) {
    const vp = new Float32Array(m.verts.length * 3);
    for (let i = 0; i < m.verts.length; i++) { vp[i * 3] = m.verts[i][0]; vp[i * 3 + 1] = m.verts[i][1]; vp[i * 3 + 2] = m.verts[i][2]; }
    const tv = new Uint32Array(m.tris.length * 3);
    for (let i = 0; i < m.tris.length; i++) { tv[i * 3] = m.tris[i][0]; tv[i * 3 + 1] = m.tris[i][1]; tv[i * 3 + 2] = m.tris[i][2]; }
    const man = wasm.Manifold.ofMesh(new wasm.Mesh({ numProp: 3, vertProperties: vp, triVerts: tv }));
    if (man.status() !== 'NoError') throw new Error('零件不是合法流形：' + man.status());
    return man;
}
// 返回 {pos:Float32Array, idx:Uint32Array, unioned:boolean}
async function makePrintMesh(p) {
    let wasm = null, err = null;
    try { wasm = await getManifold(); } catch (e) { err = e; console.warn('manifold 加载失败：', e); }
    if (wasm) {
        const list = Object.keys(cur.parts).map(k => partToManifold(wasm, cur.parts[k]));
        let U = wasm.Manifold.union(list);
        if (U.status() !== 'NoError') throw new Error('合并失败：' + U.status());
        if (p.flat && p.flatDepth > 0) {
            const yMin = U.boundingBox().min[1];
            U = U.trimByPlane({ x: 0, y: 1, z: 0 }, yMin + p.flatDepth);
        }
        const out = U.getMesh();
        if (out.numProp !== 3) throw new Error('意外的顶点属性数 ' + out.numProp);
        return { pos: new Float32Array(out.vertProperties), idx: new Uint32Array(out.triVerts), unioned: true };
    }
    // 兜底：不联网时导出重叠壳体（切片软件会按非零环绕规则自动并集）
    let nv = 0, nt = 0;
    const L = Object.keys(cur.parts).map(k => cur.parts[k]);
    for (const m of L) { nv += m.verts.length; nt += m.tris.length; }
    const pos = new Float32Array(nv * 3), idx = new Uint32Array(nt * 3);
    let vo = 0, to = 0;
    for (const m of L) {
        for (let i = 0; i < m.verts.length; i++) { pos[(vo + i) * 3] = m.verts[i][0]; pos[(vo + i) * 3 + 1] = m.verts[i][1]; pos[(vo + i) * 3 + 2] = m.verts[i][2]; }
        for (let i = 0; i < m.tris.length; i++) { idx[(to + i) * 3] = m.tris[i][0] + vo; idx[(to + i) * 3 + 1] = m.tris[i][1] + vo; idx[(to + i) * 3 + 2] = m.tris[i][2] + vo; }
        vo += m.verts.length; to += m.tris.length;
    }
    return { pos, idx, unioned: false, err };
}
function flatStats(pos, idx) {
    const nT = idx.length / 3, nV = pos.length / 3;
    const dir = new Map(); let degen = 0, vol = 0;
    for (let t = 0; t < nT; t++) {
        const a = idx[t * 3], b = idx[t * 3 + 1], c = idx[t * 3 + 2];
        if (a === b || b === c || a === c) { degen++; continue; }
        dir.set(a * nV + b, (dir.get(a * nV + b) || 0) + 1); dir.set(b * nV + c, (dir.get(b * nV + c) || 0) + 1); dir.set(c * nV + a, (dir.get(c * nV + a) || 0) + 1);
        const ax = pos[a * 3], ay = pos[a * 3 + 1], az = pos[a * 3 + 2], bx = pos[b * 3], by = pos[b * 3 + 1], bz = pos[b * 3 + 2], cx = pos[c * 3], cy = pos[c * 3 + 1], cz = pos[c * 3 + 2];
        vol += (ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx)) / 6;
    }
    let open = 0, nonMan = 0;
    for (const [key, c] of dir) {
        const u = Math.floor(key / nV), v = key - u * nV;
        const r = dir.get(v * nV + u) || 0;
        if (c !== 1 || r !== 1) { if (c > 1 || r > 1) nonMan++; else open++; }
    }
    return { verts: nV, tris: nT, open, nonMan, degen, vol };
}

function setStatus(msg, cls) { ui.status.textContent = msg; ui.status.className = cls || ''; }

async function doCheck() {
    const p = readParams(), k = mmPerUnit(p);
    setStatus('正在做布尔合并与检查…');
    try {
        const r = await makePrintMesh(p);
        const s = flatStats(r.pos, r.idx);
        mergedState = r;
        const geo = typedToGeometry(r.pos, r.idx);
        {   // 合并实体里哪些顶点在身体表面上（白斑只画在身体上）
            const nV = r.pos.length / 3, ab = new Float32Array(nV), F = getBodyFns();
            for (let i = 0; i < nV; i++) {
                const x = r.pos[i * 3], y = r.pos[i * 3 + 1], z = r.pos[i * 3 + 2];
                if (x < F.x0 - 1e-3 || x > F.x1 + 1e-3) continue;
                ab[i] = Math.abs(Math.hypot(y - F.fMid(x), z) - Math.sqrt(Math.max(0, F.fR2(x)))) < 0.004 ? 1 : 0;
            }
            geo.setAttribute('aBody', new THREE.BufferAttribute(ab, 1));
        }
        disposeMesh('merged');
        meshes.merged = new THREE.Mesh(geo, matBodyShaded); model.add(meshes.merged);
        ui.merged.disabled = false; ui.merged.checked = true; applyMaterials();
        const ok = s.open === 0 && s.nonMan === 0 && s.degen === 0;
        ui.info.innerHTML +=
            `<hr><b>打印网格</b>（${r.unioned ? '已布尔合并为单一实体' : '未联网：导出为重叠壳体'}）<br>` +
            `${s.verts.toLocaleString()} 顶点 · ${s.tris.toLocaleString()} 三角面<br>` +
            `水密/流形：${ok ? '<b class="ok">通过 ✓</b>' : '<b class="bad">未通过（开边 ' + s.open + '，非流形边 ' + s.nonMan + '，退化面 ' + s.degen + '）</b>'}<br>` +
            `体积 ≈ <b>${(s.vol * k * k * k / 1000).toFixed(1)} cm³</b>`;
        setStatus(r.unioned ? '合并完成，已在视图中显示合并后的实体。' : 'manifold 库未能加载，使用重叠壳体（可联网后重试）。', r.unioned ? 'ok' : 'bad');
    } catch (e) { console.error(e); setStatus('检查失败：' + e.message, 'bad'); }
}

// ---------- STL 导出（二进制，毫米，Z 向上，居中落床） ----------
function buildSTL(pos, idx, k) {
    const nV = pos.length / 3, nT = idx.length / 3;
    const X = new Float32Array(nV), Y = new Float32Array(nV), Z = new Float32Array(nV);
    let mnX = Infinity, mxX = -Infinity, mnY = Infinity, mxY = -Infinity, mnZ = Infinity;
    for (let i = 0; i < nV; i++) {
        const x = pos[i * 3] * k, y = pos[i * 3 + 1] * k, z = pos[i * 3 + 2] * k;
        X[i] = x; Y[i] = -z; Z[i] = y;                      // (x,y,z) → (x,-z,y)：旋转，不镜像
        if (X[i] < mnX) mnX = X[i]; if (X[i] > mxX) mxX = X[i];
        if (Y[i] < mnY) mnY = Y[i]; if (Y[i] > mxY) mxY = Y[i];
        if (Z[i] < mnZ) mnZ = Z[i];
    }
    const cx = (mnX + mxX) / 2, cy = (mnY + mxY) / 2;
    for (let i = 0; i < nV; i++) { X[i] -= cx; Y[i] -= cy; Z[i] -= mnZ; }
    const buf = new ArrayBuffer(84 + nT * 50), dv = new DataView(buf);
    const head = 'orca print-ready STL (mm, Z-up)';
    for (let i = 0; i < head.length; i++) dv.setUint8(i, head.charCodeAt(i));
    dv.setUint32(80, nT, true);
    let o = 84;
    for (let t = 0; t < nT; t++) {
        const a = idx[t * 3], b = idx[t * 3 + 1], c = idx[t * 3 + 2];
        const ux = X[b] - X[a], uy = Y[b] - Y[a], uz = Z[b] - Z[a], vx = X[c] - X[a], vy = Y[c] - Y[a], vz = Z[c] - Z[a];
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
        dv.setFloat32(o, nx, true); dv.setFloat32(o + 4, ny, true); dv.setFloat32(o + 8, nz, true); o += 12;
        for (const q of [a, b, c]) { dv.setFloat32(o, X[q], true); dv.setFloat32(o + 4, Y[q], true); dv.setFloat32(o + 8, Z[q], true); o += 12; }
        dv.setUint16(o, 0, true); o += 2;
    }
    return { buf, size: [mxX - mnX, mxY - mnY] };
}
function download(name, data, type) {
    const a = document.createElement('a');
    const url = URL.createObjectURL(new Blob([data], { type: type || 'application/octet-stream' }));
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
async function doExportSTL() {
    const p = readParams(), k = mmPerUnit(p);
    setStatus('正在合并并导出 STL…');
    try {
        const r = (mergedState && ui.merged.checked) ? mergedState : await makePrintMesh(p);
        const { buf } = buildSTL(r.pos, r.idx, k);
        download(`orca_${Math.round(p.lenMM)}mm.stl`, buf, 'model/stl');
        setStatus(r.unioned ? '已导出：单一实体 STL（毫米，Z 向上，已落床居中）。' : '已导出（重叠壳体版，未联网）。', r.unioned ? 'ok' : 'bad');
    } catch (e) { console.error(e); setStatus('导出失败：' + e.message, 'bad'); }
}

// ---------- 事件 ----------
let timer = null;
function schedule() { updateLabels(); clearTimeout(timer); timer = setTimeout(rebuild, 140); }
for (const el of [ui.len, ui.wall, ui.fin, ui.curl, ui.relief, ui.flat, ui.flatDepth]) el.addEventListener('input', schedule);
for (const el of [ui.shade, ui.wire, ui.rot, ui.merged]) el.addEventListener('change', applyMaterials);
ui.btnSTL.addEventListener('click', doExportSTL);
ui.btnCheck.addEventListener('click', doCheck);
window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
window.__orca = { rebuild, doCheck, doExportSTL, makePrintMesh, buildSTL, flatStats, get cur() { return cur; }, readParams, ui };

rebuild();
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    model.position.y = Math.sin(t * CONFIG.FLOAT_SPEED) * CONFIG.FLOAT_AMPLITUDE;
    controls.update();
    renderer.render(scene, camera);
}
animate();

            document.getElementById('btn-fold').addEventListener('click', function () {
                var p = document.getElementById('panel'); p.classList.toggle('collapsed');
                this.textContent = p.classList.contains('collapsed') ? '展开' : '收起';
            });
        })();
    </script>
